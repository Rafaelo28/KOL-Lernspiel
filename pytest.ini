[pytest]
# Damit "import crypto" in den Tests funktioniert, ohne dass die Tests am
# sys.path herumschrauben müssen.
pythonpath = .
# crypto/ ist mit aufgeführt, damit die Doctests in den Docstrings
# (z. B. HUND -> KXQG) bei jedem Lauf mitgeprüft werden.
testpaths = tests crypto
addopts = --doctest-modules
