[pytest]
# Damit "import crypto" in den Tests funktioniert, ohne dass die Tests am
# sys.path herumschrauben müssen.
pythonpath = .
# crypto/, content/ und game/ sind mit aufgeführt, damit die Doctests in den
# Docstrings (z. B. HUND -> KXQG) bei jedem Lauf mitgeprüft werden.
testpaths = tests crypto content game
addopts = --doctest-modules
