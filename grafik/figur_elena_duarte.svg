<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 300"
     data-breite="150" data-schleife-ms="4000" data-bilder="40" data-bereiche="42 40 172 172">
<!--
  Rollen-Symbol für die Figurwahl (Arbeitsplan 6.2): Elena Duarte – ehemalige Diamantenhändlerin.

  Fürs Spiel vorrendern mit:
      python3 grafik/rendern.py grafik/figur_elena_duarte.svg
  Die Animation läuft im Spiel nur auf der gewählten Karte; die anderen
  zeigen Bild 0. Der Grund (#1a1d3a) ist die Farbe der Karten (ui/stil.py,
  FARBE_KARTE) – sonst stünde ein Rechteck auf der Karte.
  Alle Animationsdauern teilen data-schleife-ms – siehe dokumentation/Animationen.md.
-->
<title>Elena Duarte – ehemalige Diamantenhändlerin</title>
<desc>Eine Lupe mit dunklem Rahmen und goldenem Ring am Griff. Im Glas liegt vergrößert ein Diamant, der funkelt; ein Lichtreflex wandert über das Glas.</desc>
<style>
  /* Ein Lichtreflex wandert über das Glas, der Stein funkelt. */
  .reflex { animation: reflex 4s ease-in-out infinite; }
  @keyframes reflex { 0%, 30% { transform: translateX(-190px); } 62%, 100% { transform: translateX(190px); } }
  .glanz { opacity: 0; animation: glanz 2s ease-in-out infinite; }
  @keyframes glanz { 0%, 100% { opacity: 0; } 50% { opacity: .7; } }
  .funkeln { transform-box: fill-box; transform-origin: center; animation: funkeln 2s ease-in-out infinite; }
  @keyframes funkeln {
    0%, 36%, 100% { transform: scale(0) rotate(0deg); opacity: 0; }
    18% { transform: scale(1) rotate(45deg); opacity: 1; }
  }
</style>
<defs>
  <radialGradient id="medaille" cx="150" cy="115" r="175" gradientUnits="userSpaceOnUse">
    <stop offset="0" stop-color="#303770"/><stop offset="1" stop-color="#1d2044"/>
  </radialGradient>
  <filter id="weich" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="4"/></filter>
  <filter id="schatten" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="5"/></filter>
  <radialGradient id="glas" cx="108" cy="96" r="98" gradientUnits="userSpaceOnUse">
    <stop offset="0" stop-color="#4a58a6"/><stop offset=".7" stop-color="#28316b"/><stop offset="1" stop-color="#1a2050"/>
  </radialGradient>
  <linearGradient id="rahmen" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#6b7285"/><stop offset=".45" stop-color="#2c3040"/><stop offset="1" stop-color="#151821"/>
  </linearGradient>
  <linearGradient id="griff" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="#3a2a22"/><stop offset=".45" stop-color="#6b4a36"/><stop offset="1" stop-color="#2a1d17"/>
  </linearGradient>
  <linearGradient id="messing" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="#9a6d1c"/><stop offset=".5" stop-color="#f1cf73"/><stop offset="1" stop-color="#8a5f14"/>
  </linearGradient>
  <linearGradient id="reflex" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="#fff" stop-opacity="0"/><stop offset=".5" stop-color="#fff" stop-opacity=".42"/>
    <stop offset="1" stop-color="#fff" stop-opacity="0"/>
  </linearGradient>
  <clipPath id="linse"><circle cx="128" cy="126" r="68"/></clipPath>
  <clipPath id="stein"><path d="M96.0,84.0 L160.0,84.0 L184.0,112.0 L128.0,178.0 L72.0,112.0 Z"/></clipPath>
</defs>
<rect width="300" height="300" fill="#1a1d3a"/>
<circle cx="150" cy="150" r="136" fill="url(#medaille)"/>
<circle cx="150" cy="150" r="136" fill="none" stroke="#363d7a" stroke-width="3"/>
<circle cx="150" cy="150" r="127" fill="none" stroke="#e2b651" stroke-opacity=".28" stroke-width="1.5"/>

<!-- Griff -->
<g transform="rotate(-45 128 126)">
