  <rect x="115" y="200" width="26" height="28" rx="4" fill="url(#messing)" stroke="#5c3f0d" stroke-width="1.5"/>
  <line x1="115" y1="208" x2="141" y2="208" stroke="#5c3f0d" stroke-width="1.5"/>
</g>
