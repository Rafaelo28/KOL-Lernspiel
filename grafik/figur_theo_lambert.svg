<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 300"
     data-breite="150" data-schleife-ms="4000" data-bilder="40" data-bereiche="136 118 138 118">
<!--
  Rollen-Symbol für die Figurwahl (Arbeitsplan 6.2): Théo Lambert – Fälscher und Tarnungsspezialist.

  Fürs Spiel vorrendern mit:
      python3 grafik/rendern.py grafik/figur_theo_lambert.svg
  Die Animation läuft im Spiel nur auf der gewählten Karte; die anderen
  zeigen Bild 0. Der Grund (#1a1d3a) ist die Farbe der Karten (ui/stil.py,
  FARBE_KARTE) – sonst stünde ein Rechteck auf der Karte.
  Alle Animationsdauern teilen data-schleife-ms – siehe dokumentation/Animationen.md.
-->
<title>Théo Lambert – Fälscher und Tarnungsspezialist</title>
<desc>Ein aufgeschlagener Pass mit rotem Einband: links ein Passbild, rechts Zeilen und ein violetter Stempel. Ein Füller setzt eine Unterschrift, die danach wieder verblasst.</desc>
<style>
  /* Der Füller setzt eine Unterschrift – dann verblasst sie, und es geht von vorn los. */
  .schrift { stroke-dasharray: 100 100; animation: schreiben 4s ease-in-out infinite; }
  @keyframes schreiben {
    0%, 6% { stroke-dashoffset: 100; opacity: 1; }
    58%, 84% { stroke-dashoffset: 0; opacity: 1; }
    96%, 100% { stroke-dashoffset: 0; opacity: 0; }
  }
  .fueller { offset-path: path("M150,212 C156,196 164,192 162,206 C160,220 170,210 176,200 C180,194 182,208 188,206 C194,204 198,196 204,200 C208,203 212,208 222,202"); offset-rotate: 0deg; offset-anchor: 0 0;
             animation: fuehren 4s ease-in-out infinite; }
  @keyframes fuehren {
    0%, 6% { offset-distance: 0%; }
    58%, 84% { offset-distance: 100%; }
    100% { offset-distance: 0%; }
  }
</style>
<defs>
  <radialGradient id="medaille" cx="150" cy="115" r="175" gradientUnits="userSpaceOnUse">
    <stop offset="0" stop-color="#303770"/><stop offset="1" stop-color="#1d2044"/>
  </radialGradient>
  <filter id="weich" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="4"/></filter>
  <filter id="schatten" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="5"/></filter>
  <linearGradient id="einband" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#9a2a38"/><stop offset="1" stop-color="#5e1520"/>
  </linearGradient>
  <linearGradient id="seite" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#f6f0e0"/><stop offset="1" stop-color="#e7dcc2"/>
  </linearGradient>
  <linearGradient id="foto" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#b9c4d6"/><stop offset="1" stop-color="#8e9ab0"/>
  </linearGradient>
  <linearGradient id="schaft" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="#0d0f16"/><stop offset=".45" stop-color="#3b4152"/><stop offset="1" stop-color="#0d0f16"/>
  </linearGradient>
  <linearGradient id="feder" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="#9a6d1c"/><stop offset=".5" stop-color="#f1cf73"/><stop offset="1" stop-color="#8a5f14"/>
  </linearGradient>
</defs>
<rect width="300" height="300" fill="#1a1d3a"/>
<circle cx="150" cy="150" r="136" fill="url(#medaille)"/>
<circle cx="150" cy="150" r="136" fill="none" stroke="#363d7a" stroke-width="3"/>
<circle cx="150" cy="150" r="127" fill="none" stroke="#e2b651" stroke-opacity=".28" stroke-width="1.5"/>

<g transform="rotate(-6 150 150)">
  <!-- Einband und Seiten -->
  <rect x="38" y="80" width="224" height="150" rx="8" fill="#0b0d18" opacity=".5" transform="translate(4 6)"
        filter="url(#schatten)"/>
  <rect x="38" y="80" width="224" height="150" rx="8" fill="url(#einband)"/>
  <path d="M46,86 L148,90 L148,222 L46,224 Z" fill="url(#seite)"/>
  <path d="M152,90 L254,86 L254,224 L152,222 Z" fill="url(#seite)"/>
  <path d="M148,90 L152,90 L152,222 L148,222 Z" fill="#c9bb98"/>
  <!-- Sicherheitsmuster -->
  <g fill="none" stroke="#b9c9b0" stroke-opacity=".7" stroke-width="1">
    <path d="M50,200 C70,190 90,210 110,200 C130,190 140,206 146,200"/>
    <path d="M50,208 C70,198 90,218 110,208 C130,198 140,214 146,208"/>
    <path d="M156,104 C176,94 196,114 216,104 C236,94 246,110 252,104"/>
  </g>
  <!-- Passbild -->
  <rect x="60" y="102" width="50" height="62" rx="3" fill="url(#foto)" stroke="#6f7a90" stroke-width="1.5"/>
  <circle cx="85" cy="126" r="12" fill="#56617a"/>
  <path d="M64,164 C66,146 76,140 85,140 C94,140 104,146 106,164 Z" fill="#56617a"/>
  <!-- Zeilen -->
  <g stroke="#9c9378" stroke-width="3" stroke-linecap="round">
    <line x1="118" y1="110" x2="140" y2="110"/><line x1="118" y1="122" x2="136" y2="122"/>
    <line x1="118" y1="134" x2="140" y2="134"/><line x1="60" y1="178" x2="138" y2="178"/>
    <line x1="60" y1="188" x2="120" y2="188"/>
    <line x1="164" y1="112" x2="240" y2="112"/><line x1="164" y1="124" x2="226" y2="124"/>
  </g>
  <!-- Stempel -->
  <g transform="rotate(-14 212 160)" fill="none" stroke="#6b4bbf" stroke-opacity=".8">
    <circle cx="212" cy="160" r="24" stroke-width="3"/>
    <circle cx="212" cy="160" r="17" stroke-width="1.5"/>
    <path d="M198,160 L226,160 M212,146 L212,174" stroke-width="2"/>
  </g>
  <!-- Unterschrift und Füller -->
  <path class="schrift" d="M150,212 C156,196 164,192 162,206 C160,220 170,210 176,200 C180,194 182,208 188,206 C194,204 198,196 204,200 C208,203 212,208 222,202" pathLength="100" fill="none" stroke="#1b2a5c" stroke-width="3"
        stroke-linecap="round" stroke-linejoin="round"/>
  <g class="fueller">
    <g transform="rotate(38)">
      <path d="M0,0 L-5,-16 L5,-16 Z" fill="url(#feder)" stroke="#5c3f0d" stroke-width="1"/>
      <line x1="0" y1="-2" x2="0" y2="-12" stroke="#5c3f0d" stroke-width="1"/>
      <rect x="-6.5" y="-26" width="13" height="11" rx="2" fill="#c9a24a" stroke="#5c3f0d" stroke-width="1"/>
      <rect x="-7.5" y="-78" width="15" height="53" rx="6" fill="url(#schaft)" stroke="#05060b" stroke-width="1"/>
      <rect x="-2" y="-72" width="3" height="40" rx="1.5" fill="#fff" opacity=".18"/>
    </g>
  </g>
</g>
</svg>
