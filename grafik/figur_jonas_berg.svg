<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 300"
     data-breite="150" data-schleife-ms="4000" data-bilder="40" data-bereiche="24 24 252 252">
<!--
  Rollen-Symbol für die Figurwahl (Arbeitsplan 6.2): Jonas Berg – Technik-Experte.

  Fürs Spiel vorrendern mit:
      python3 grafik/rendern.py grafik/figur_jonas_berg.svg
  Die Animation läuft im Spiel nur auf der gewählten Karte; die anderen
  zeigen Bild 0. Der Grund (#1a1d3a) ist die Farbe der Karten (ui/stil.py,
  FARBE_KARTE) – sonst stünde ein Rechteck auf der Karte.
  Alle Animationsdauern teilen data-schleife-ms – siehe dokumentation/Animationen.md.
-->
<title>Jonas Berg – Technik-Experte</title>
<desc>Ein dunkler Mikrochip mit silbernen Beinchen. Von ihm führen Leiterbahnen nach außen, auf denen helle Signale laufen; der Kern des Chips pulsiert.</desc>
<style>
  /* Signale laufen vom Chip über die Leiterbahnen nach außen, der Kern pulsiert. */
  .signal { fill: none; stroke: #b8fbff; stroke-width: 5; stroke-linecap: round;
            stroke-dasharray: 9 131; animation: signal 2s linear infinite; }
  .signal.lang { animation-duration: 4s; }
  @keyframes signal { 0% { stroke-dashoffset: 9; } 100% { stroke-dashoffset: -131; } }
  .kern { animation: kern 2s ease-in-out infinite; }
  @keyframes kern { 0%, 100% { opacity: .35; } 50% { opacity: 1; } }
</style>
<defs>
  <radialGradient id="medaille" cx="150" cy="115" r="175" gradientUnits="userSpaceOnUse">
    <stop offset="0" stop-color="#303770"/><stop offset="1" stop-color="#1d2044"/>
  </radialGradient>
  <filter id="weich" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="4"/></filter>
  <filter id="schatten" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="5"/></filter>
  <linearGradient id="gehaeuse" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#39415a"/><stop offset=".5" stop-color="#1d2232"/><stop offset="1" stop-color="#11141e"/>
  </linearGradient>
  <linearGradient id="kristall" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#6a7ba8"/><stop offset="1" stop-color="#27304d"/>
  </linearGradient>
  <radialGradient id="leuchten" cx="150" cy="150" r="34" gradientUnits="userSpaceOnUse">
    <stop offset="0" stop-color="#b8fbff"/><stop offset=".45" stop-color="#48d9e8" stop-opacity=".7"/>
    <stop offset="1" stop-color="#48d9e8" stop-opacity="0"/>
  </radialGradient>
</defs>
<rect width="300" height="300" fill="#1a1d3a"/>
<circle cx="150" cy="150" r="136" fill="url(#medaille)"/>
<circle cx="150" cy="150" r="136" fill="none" stroke="#363d7a" stroke-width="3"/>
<circle cx="150" cy="150" r="127" fill="none" stroke="#e2b651" stroke-opacity=".28" stroke-width="1.5"/>

